# Continuous integration for Imboni.
#
# Software checks only: this workflow never downloads NISR files, never touches restricted microdata and needs
# no secrets. It runs against the validated, committed outputs in data/processed. Refreshing data from NISR is
# a separate, manual step (python -m backend.pipeline.build --fetch) run by the team, not by CI.
name: CI

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python · tests, data checks, Streamlit smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Lint (pyflakes rules, ruff.toml)
        run: ruff check --output-format=github .

      - name: Validate committed processed data
        run: |
          python - <<'PY'
          import json, sys
          from pathlib import Path
          from backend.pipeline.fetch import sha256
          from backend.pipeline.paths import METADATA_DIR, PROCESSED_DIR
          manifest = json.loads((METADATA_DIR / "processed_manifest.json").read_text("utf-8"))
          bad = [n for n, d in manifest["outputs"].items() if sha256(PROCESSED_DIR / n) != d]
          report = json.loads((PROCESSED_DIR / "validation_report.json").read_text("utf-8"))["summary"]
          print(f"outputs: {len(manifest['outputs'])}, checksum mismatches: {bad or 'none'}")
          print(f"validation: {report['passed']}/{report['total']} passed, {report['errors']} errors, {report['warnings']} source warnings")
          sys.exit(1 if bad or report["errors"] else 0)
          PY

      - name: Check application imports
        run: python -c "import backend.app.main, dashboard.views.national, dashboard.views.simulator; print('imports ok')"

      - name: Run test suite (pipeline, analytics, API, dashboard pages)
        run: python -m pytest -q --maxfail=5

      - name: Streamlit server smoke test
        run: |
          streamlit run streamlit_app.py --server.headless true --server.port 8501 > streamlit.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8501/_stcore/health >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://localhost:8501/_stcore/health
          curl -fsS -o /dev/null -w "index page HTTP %{http_code}\n" http://localhost:8501/
          if grep -E "Traceback|Error" streamlit.log; then cat streamlit.log; exit 1; fi
          kill %1

  frontend:
    name: React frontend · typecheck, lint, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
